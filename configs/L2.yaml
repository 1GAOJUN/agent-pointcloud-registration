# L2 关卡：大角度旋转（60–180 度随机）+ 干净数据
# 旋转角度落在 60–180 度范围内，无噪声、无离群点、无裁剪。
# 朴素 ICP（固定初值单位阵）对大角度极易发散，预期失败。
level: L2
n_points: 30000

# --- 位姿变换：大角度（各轴落在 60–180 度区间内）---
rot_x_deg: 75.0
rot_y_deg: 120.0
rot_z_deg: 150.0
translation:
  - 0.20
  - 0.40
  - 0.30

# --- 退化处理：干净 ---
noise_sigma: 0.0
outlier_ratio: 0.0
crop_ratio: 0.0
crop_axis: z
crop_sign: "+"

# --- 写死的随机种子（可复现）---
seed: 202

# --- 达标阈值 ---
thresholds:
  rot_max_deg: 5.0
  fitness_min: 0.8
